plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gyrofix'
    compileSdk 34

    defaultConfig {
        applicationId "com.gyrofix"
        minSdk 21
        targetSdk 34
        versionCode 11
        versionName "8.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}